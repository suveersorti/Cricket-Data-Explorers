<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel = "stylesheet" type="text/css"  href="static/styles/styles.css">
</link>
</head>
<body>
    <div align= "center">
    <div align= "center" class="border">
    <div align="header">
        <h1 class="word">Login</h1>
        </div>
        <h2 class="word">
            <form action="/login" method="POST">
                <div class="msg">{{msg}}</div>
                <input id="username" name="username" type="text" placeholder="Enter your username" class="textbox"><br></br>
                <input id="password" name="password" type="password" placeholders="Enter your Password" class="textbox"><br></br>
                <input type="submit" value="Sign in" class="btn"><br></br>
            </form>
        </h2>
        <p class="bottom">Don't have account? </p> <a class="bottom" href="/register"
        Sign up here></a></p>
    </div>
    </div>
    </div>
</body>
</html>
